<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Book Reader">
<meta name="theme-color" content="#1c1916">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Book Reader</title>
<style>
:root{
  --bg:#2a2521; --bar:#1c1916; --bar-ink:#ece4d6; --bar-muted:#a59a8a; --bar-line:rgba(255,255,255,.15);
  --paper:#f8f3e6; --ink:#2b2520; --muted:#9a8f80; --accent:#b4502f;
  --fs:18px; --pageH:600px; --side:20px;
  --st:env(safe-area-inset-top,0px); --sr:env(safe-area-inset-right,0px);
  --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px);
}
:root[data-theme="sepia"]{ --bg:#352c24; --paper:#ecdcbc; --ink:#3d2f20; --muted:#8a755a; }
:root[data-theme="night"]{ --bg:#0c0c0d; --bar:#141415; --paper:#1d1d1f; --ink:#cfc9bf; --muted:#77726b; --accent:#d9774f; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;background:var(--bg);color:var(--bar-ink);
  font:15px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,select,input{font:inherit;color:inherit}
svg{display:block}

/* ---- bars (slide away while reading; tap the middle of the page to bring them back) ---- */
#topsafe{position:fixed;left:0;right:0;top:0;height:var(--st);background:var(--bar);z-index:5}
.bar{position:fixed;left:0;right:0;z-index:4;background:var(--bar);
  background:color-mix(in srgb,var(--bar) 93%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  transition:transform .22s ease,opacity .22s ease}
header.bar{top:0;padding:calc(var(--st) + 2px) calc(var(--sr) + 6px) 4px calc(var(--sl) + 6px);box-shadow:0 1px 0 var(--bar-line)}
footer.bar{bottom:0;padding:8px calc(var(--sr) + 14px) calc(var(--sb) + 8px) calc(var(--sl) + 14px);box-shadow:0 -1px 0 var(--bar-line)}
body.ready:not(.chrome) header.bar{transform:translateY(-100%);opacity:0;pointer-events:none}
body.ready:not(.chrome) footer.bar{transform:translateY(100%);opacity:0;pointer-events:none}
.row{display:flex;align-items:center;gap:4px;min-height:44px}
#title{flex:1;min-width:0;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;text-align:center}
.ib{position:relative;flex:none;width:44px;height:44px;display:grid;place-items:center;background:transparent;border:0;border-radius:10px;padding:0;cursor:pointer}
.ib:active{background:rgba(255,255,255,.12)}
.ib svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tocBtn{overflow:hidden}
#toc{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer}
#toc option{color:#111;background:#fff}
#searchRow{gap:6px;padding:2px 2px 4px}
#search{flex:1;min-width:0;font-size:16px;background:rgba(255,255,255,.08);border:1px solid var(--bar-line);border-radius:10px;
  padding:8px 10px;-webkit-appearance:none;appearance:none;-webkit-user-select:text;user-select:text}
#hitinfo{color:var(--bar-muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tb{min-height:40px;padding:0 16px;background:transparent;border:1px solid var(--bar-line);border-radius:10px;cursor:pointer}
.tb:active{background:rgba(255,255,255,.12)}
#slider{flex:1;min-width:0;height:32px;accent-color:var(--accent)}
#pageno{color:var(--bar-muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;min-width:112px;text-align:right}
.tools{justify-content:center;gap:10px}
#smaller,#bigger{min-width:54px}
#theme{min-width:84px}

/* ---- reading area ---- */
#stage{position:absolute;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none}
body.ready.mode-mobi #stage{background:var(--paper)}
body.drag #stage{outline:3px dashed var(--accent);outline-offset:-14px}

#welcome{text-align:center;max-width:430px;padding:calc(var(--st) + 48px) 24px calc(var(--sb) + 72px)}
#welcome h1{font:600 32px "Iowan Old Style",Georgia,serif;margin:0 0 8px}
#welcome p{color:var(--bar-muted);margin:12px 0}
#welcome .small{font-size:14px}
#welcome .err{color:#ff9b85}
#welcome b{color:var(--bar-ink);font-weight:600}
.btn{border:1px solid var(--bar-line);border-radius:12px;background:transparent;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-size:17px;font-weight:600;padding:13px 28px;margin:10px 0 6px}
.btn.primary:active{filter:brightness(1.12)}
body.ready #welcome{display:none}

#busy{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;background:var(--bar);color:var(--bar-ink);
  padding:12px 22px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
body.busy #busy{display:block}

#runhead,#mini{position:fixed;left:50%;transform:translateX(-50%);max-width:70%;z-index:2;display:none;pointer-events:none;
  font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;color:var(--muted)}
#runhead{top:calc(var(--st) + 8px)}
#mini{bottom:calc(var(--sb) + 7px)}
body.ready.mode-mobi #runhead,body.ready #mini{display:block}
body.mode-pdf #mini{color:var(--bar-muted)}

/* ebook pages: one page-tall strip of columns, slid sideways a page at a time */
#frame{position:absolute;inset:0;display:none;color:var(--ink);
  padding:calc(var(--st) + 30px) calc(var(--sr) + var(--side)) calc(var(--sb) + 28px) calc(var(--sl) + var(--side))}
body.ready.mode-mobi #frame{display:block}
body.loading #frame,body.loading #pdfwrap{visibility:hidden}
#box{width:100%;height:100%;display:flex;justify-content:center}
#view{position:relative;overflow:hidden;flex:none}
#view.two::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:64px;transform:translateX(-50%);pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.06) 42%,rgba(0,0,0,.13) 50%,rgba(0,0,0,.06) 58%,transparent)}
#content{height:100%;column-fill:auto;font-family:"Iowan Old Style",Georgia,"Palatino Linotype",serif;font-size:var(--fs);
  line-height:1.55;text-align:justify;-webkit-hyphens:auto;hyphens:auto;overflow-wrap:break-word;orphans:2;widows:2}
#content p{margin:0 0 .55em}
#content.kf p{margin:0}
#content h1,#content h2,#content h3,#content h4{line-height:1.25;text-align:center;-webkit-column-break-after:avoid;break-after:avoid}
#content img{display:block;margin:0 auto;width:auto;height:auto;max-width:100%;max-height:var(--pageH);
  -webkit-column-break-inside:avoid;break-inside:avoid}
#content .pb{-webkit-column-break-before:always;break-before:column;height:0;margin:0;padding:0}
#content a{color:inherit;text-decoration-color:var(--muted)}
::highlight(hit){background:#ffd54a;color:#111}

/* PDF pages */
#pdfwrap{display:none;position:absolute;inset:0;overflow:hidden;
  padding:calc(var(--st) + 10px) calc(var(--sr) + 8px) calc(var(--sb) + 26px) calc(var(--sl) + 8px)}
body.ready.mode-pdf #pdfwrap{display:flex}
#pdfview{position:relative;display:flex;flex:none;margin:auto;box-shadow:0 1px 2px rgba(0,0,0,.3),0 10px 34px rgba(0,0,0,.4)}
#pdfview.two::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:64px;transform:translateX(-50%);pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.07) 42%,rgba(0,0,0,.16) 50%,rgba(0,0,0,.07) 58%,transparent)}
.pg{position:relative;background:#fff}
.pg canvas{display:block}
/* Sepia and Night recolour a PDF's text while it is drawn (see pdfInk); pictures keep their real colours */
:root[data-theme="sepia"] .pg,:root[data-theme="night"] .pg{background:var(--paper)}
.hl{position:absolute;background:rgba(255,196,0,.42);border-radius:2px;pointer-events:none}
:root[data-theme="night"] .hl{background:rgba(255,205,60,.6)}

body:not(.ready) .needs-book{display:none !important}
</style>
</head>
<body>
<div id="topsafe"></div>
<main id="stage">
  <div id="welcome">
    <h1>Book Reader</h1>
    <p>Open a <b>.mobi</b> ebook or a <b>PDF</b>.</p>
    <button class="btn primary" id="openBtn2">Choose a book…</button>
    <p class="small" id="lastBook" hidden></p>
    <p class="small">If a menu pops up, pick <b>Choose File</b>. Your books stay on this phone; nothing is uploaded.</p>
    <p class="small" id="installTip" hidden>Tip: tap Share, then <b>Add to Home Screen</b>, to use this like an app, even offline.</p>
    <p class="err" id="err" hidden></p>
  </div>
  <div id="frame"><div id="box"><div id="view"><div id="content"></div></div></div></div>
  <div id="pdfwrap"><div id="pdfview"></div></div>
</main>
<div id="runhead"></div>
<div id="mini"></div>
<div id="busy">Opening…</div>

<header class="bar">
  <div class="row">
    <button class="ib" id="openBtn" aria-label="Open a book"><svg viewBox="0 0 24 24"><path d="M3 5.5c2.5-1 5.5-1 9 1 3.5-2 6.5-2 9-1V19c-2.5-1-5.5-1-9 1-3.5-2-6.5-2-9-1z"/><path d="M12 6.5V20"/></svg></button>
    <div id="title">Book Reader</div>
    <label class="ib needs-book" id="tocBtn" aria-label="Contents"><svg viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01" stroke-width="3"/></svg><select id="toc"><option value="">Contents</option></select></label>
    <button class="ib needs-book" id="searchBtn" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg></button>
  </div>
  <div class="row needs-book" id="searchRow" hidden>
    <input id="search" type="search" enterkeyhint="search" placeholder="Search this book" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <span id="hitinfo"></span>
    <button class="ib" id="hitPrev" aria-label="Previous match"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="ib" id="hitNext" aria-label="Next match"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="tb" id="searchDone">Done</button>
  </div>
</header>
<footer class="bar needs-book">
  <div class="row">
    <input type="range" id="slider" min="0" max="0" value="0" aria-label="Go to page">
    <span id="pageno"></span>
  </div>
  <div class="row tools">
    <button class="tb" id="smaller" aria-label="Smaller text">A−</button>
    <button class="tb" id="bigger" aria-label="Bigger text">A+</button>
    <button class="tb" id="theme" aria-label="Switch colours">Paper</button>
  </div>
</footer>
<input type="file" id="file" hidden>

<script id="parser">
// MOBI (Kindle) parser: PalmDB records -> decompressed HTML + image records. No DOM use.
function parseMobi(buf) {
  const b = new Uint8Array(buf);
  const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
  const u16 = o => dv.getUint16(o), u32 = o => dv.getUint32(o);
  const ascii = (o, n) => String.fromCharCode(...b.subarray(o, o + n));
  const type = ascii(60, 8);
  if (type !== 'BOOKMOBI' && type !== 'TEXtREAd') throw new Error("this doesn't look like a MOBI ebook or a PDF.");

  const n = u16(76), offs = [];
  for (let i = 0; i < n; i++) offs.push(u32(78 + i * 8));
  offs.push(b.length);
  const rec = i => b.subarray(offs[i], offs[i + 1]);

  const r0 = offs[0];
  const comp = u16(r0), textRecs = u16(r0 + 8);
  if (u16(r0 + 12) !== 0) throw new Error('this book is DRM-locked, so only the Kindle app can open it.');

  let encoding = 'windows-1252', title = '', firstImage = Infinity, extra = 0;
  if (ascii(r0 + 16, 4) === 'MOBI') {
    const hl = u32(r0 + 20);
    if (u32(r0 + 28) === 65001) encoding = 'utf-8';
    firstImage = u32(r0 + 0x6C);
    if (hl >= 0xE4) extra = u16(r0 + 0xF2);
    const dec = new TextDecoder(encoding);
    const nameOff = u32(r0 + 0x54), nameLen = u32(r0 + 0x58);
    if (nameLen && r0 + nameOff + nameLen <= b.length) title = dec.decode(b.subarray(r0 + nameOff, r0 + nameOff + nameLen));
    if (u32(r0 + 0x80) & 0x40) {
      const e = r0 + 16 + hl;
      if (ascii(e, 4) === 'EXTH') {
        let p = e + 12;
        for (let i = 0, c = u32(e + 8); i < c && p + 8 <= b.length; i++) {
          const t = u32(p), l = u32(p + 4);
          if (t === 503 && l > 8) title = dec.decode(b.subarray(p + 8, p + l));
          if (l < 8) break;
          p += l;
        }
      }
    }
  }
  if (comp !== 1 && comp !== 2) throw new Error("this book uses a compression this reader can't handle.");

  const parts = []; let total = 0;
  for (let i = 1; i <= textRecs && i < n; i++) {
    let d = rec(i);
    d = d.subarray(0, Math.max(0, d.length - trailingSize(d, extra)));
    const out = comp === 2 ? palmdoc(d) : d;
    parts.push(out); total += out.length;
  }
  const text = new Uint8Array(total);
  let at = 0; for (const x of parts) { text.set(x, at); at += x.length; }

  const html = new TextDecoder(encoding).decode(binToBytes(processHtml(bytesToBin(text))));

  const images = [];
  if (firstImage < n) for (let i = firstImage; i < n; i++) { const d = rec(i); images.push({ mime: sniffImage(d), data: d }); }
  return { title: title.trim(), html, images };
}

function palmdoc(d) {
  let out = new Uint8Array(Math.max(8192, d.length * 3)), o = 0;
  const room = k => { if (o + k > out.length) { const t = new Uint8Array(out.length * 2 + k); t.set(out); out = t; } };
  for (let i = 0; i < d.length;) {
    const c = d[i++];
    if (c >= 1 && c <= 8) { room(c); for (let k = 0; k < c && i < d.length; k++) out[o++] = d[i++]; }
    else if (c < 0x80) { room(1); out[o++] = c; }
    else if (c >= 0xC0) { room(2); out[o++] = 0x20; out[o++] = c ^ 0x80; }
    else {
      if (i >= d.length) break;
      const v = (c << 8) | d[i++], dist = (v >> 3) & 0x7FF, len = (v & 7) + 3;
      room(len);
      for (let k = 0; k < len; k++) { out[o] = o >= dist ? out[o - dist] : 0; o++; }
    }
  }
  return out.subarray(0, o);
}

// Bytes tacked onto the end of each text record (index data / multibyte overlap), not part of the book.
function trailingSize(d, flags) {
  const size = d.length; let num = 0;
  const entry = end => { let r = 0, shift = 0; while (end > 0) { const v = d[end - 1]; r |= (v & 0x7F) << shift; shift += 7; end--; if ((v & 0x80) || shift >= 28) break; } return r; };
  for (let f = flags >> 1; f; f >>= 1) if (f & 1) num += entry(size - num);
  if ((flags & 1) && size - num - 1 >= 0) num += (d[size - num - 1] & 3) + 1;
  return num;
}

function sniffImage(d) {
  if (d[0] === 0xFF && d[1] === 0xD8) return 'image/jpeg';
  if (d[0] === 0x89 && d[1] === 0x50 && d[2] === 0x4E && d[3] === 0x47) return 'image/png';
  if (d[0] === 0x47 && d[1] === 0x49 && d[2] === 0x46) return 'image/gif';
  if (d[0] === 0x42 && d[1] === 0x4D) return 'image/bmp';
  return null;
}

function bytesToBin(u8) { let s = ''; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return s; }
function binToBytes(s) { const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i) & 255; return u; }

// Works on the raw byte string, because MOBI links ("filepos") are byte offsets into it.
function processHtml(bin) {
  const want = new Set();
  bin.replace(/\bfilepos\s*=\s*['"]?(\d+)/gi, (m, d) => { want.add(parseInt(d, 10)); return m; });
  const out = []; let last = 0;
  for (const target of [...want].sort((a, b) => a - b)) {
    let p = Math.min(target, bin.length);
    if (p > 0) { const lt = bin.lastIndexOf('<', p - 1), gt = bin.lastIndexOf('>', p - 1); if (lt > gt) p = lt; }
    if (/^<mbp:pagebreak/i.test(bin.slice(p, p + 15))) { const e = bin.indexOf('>', p); if (e > 0) p = e + 1; }
    if (p < last) p = last;
    out.push(bin.slice(last, p), '<a id="fp' + target + '"></a>');
    last = p;
  }
  out.push(bin.slice(last));
  return out.join('')
    .replace(/<head[\s\S]*?<\/head>/i, '')
    .replace(/\bfilepos\s*=\s*['"]?(\d+)['"]?/gi, (m, d) => 'href="#fp' + parseInt(d, 10) + '"')
    .replace(/\brecindex\s*=\s*['"]?(\d+)['"]?/gi, (m, d) => 'data-rec="' + parseInt(d, 10) + '"')
    .replace(/<mbp:pagebreak[^>]*>/gi, '<div class="pb"></div>')
    .replace(/<\/?mbp:[^>]*>/gi, '');
}
</script>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const el = {};
for (const id of ['openBtn','openBtn2','file','title','toc','tocBtn','searchBtn','searchRow','search','hitinfo','hitPrev','hitNext','searchDone',
  'smaller','bigger','theme','stage','err','frame','box','view','content','pdfwrap','pdfview','slider','pageno','mini','runhead','lastBook','installTip']) el[id] = $(id);
const root = document.documentElement, body = document.body;
const S = { mode: 'mobi', cols: 1, colW: 300, gap: 40, step: 340, pages: 1, spreads: 1, spread: 0, ready: false, key: '', title: '', w: 0, h: 0 };
const P = { doc: null, n: 0, aspect: 0.75, cols: 1, pageW: 0, pageH: 0, zoom: 1, cache: new Map(), token: 0, showing: null,
  text: null, textBuilding: null, hit: null, dests: [], afterSwap: null };
const ZOOM_MAX = 4, ZOOM_STEPS = [1, 1.25, 1.5, 2, 2.5, 3, 4];
const MAX_CANVAS_PX = 10e6;   // iPhones refuse canvases much past 16M pixels, and run out of canvas memory long before a desktop would
const CACHE_MAX = 5;
const coarse = matchMedia('(pointer: coarse)').matches;
let endmark = null, urls = [], textIdx = [], fullText = '', anchors = [], hits = [], hitAt = -1, lastQuery = '';
const range = document.createRange();

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

// ---- preferences
const THEMES = ['paper', 'sepia', 'night'], THEME_NAMES = { paper: 'Paper', sepia: 'Sepia', night: 'Night' };
const prefs = Object.assign({ fs: 18, theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'paper' }, store.get('br:prefs', {}));
if (!THEMES.includes(prefs.theme)) prefs.theme = 'paper';
prefs.fs = clamp(+prefs.fs || 18, 13, 32);
function applyPrefs() {
  root.dataset.theme = prefs.theme;
  root.style.setProperty('--fs', prefs.fs + 'px');
  el.theme.textContent = THEME_NAMES[prefs.theme];
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = getComputedStyle(root).getPropertyValue('--bar').trim() || '#1c1916';
  store.set('br:prefs', prefs);
}
applyPrefs();

function setChrome(on) { body.classList.toggle('chrome', !!on); }
function setMode(m) {
  S.mode = m;
  body.classList.toggle('mode-pdf', m === 'pdf');
  body.classList.toggle('mode-mobi', m !== 'pdf');
  el.smaller.textContent = m === 'pdf' ? '−' : 'A−';
  el.bigger.textContent = m === 'pdf' ? '+' : 'A+';
  el.smaller.setAttribute('aria-label', m === 'pdf' ? 'Zoom out' : 'Smaller text');
  el.bigger.setAttribute('aria-label', m === 'pdf' ? 'Zoom in' : 'Bigger text');
}
function resetBook() {
  S.ready = false;
  clearHits(); el.search.value = '';
  if (P.doc) P.doc.destroy().catch(() => {});
  Object.assign(P, { doc: null, n: 0, text: null, textBuilding: null, hit: null, dests: [], showing: null, afterSwap: null, zoom: 1 });
  dropCache(); P.token++;
  for (const d of el.pdfview.children) freeDiv(d);
  el.pdfview.replaceChildren(); el.pdfview.style.transform = '';
  urls.forEach(u => URL.revokeObjectURL(u)); urls = [];
  el.content.replaceChildren(); textIdx = []; fullText = ''; anchors = [];
  el.toc.length = 1;
}

// ---- shared paging
function go(s, save = true, anim = false) {
  S.spread = clamp(Math.round(s) || 0, 0, S.spreads - 1);
  let first, last, total;
  if (S.mode === 'pdf') {
    const nums = pdfPagesOf(S.spread);
    first = nums[0]; last = nums[nums.length - 1]; total = P.n;

    if (out.tocEntries) { el.toc.value = 'o' + (out.tocEntries - 1); el.toc.onchange(); await settle(); out.afterLastTocEntry = shown(); }
    el.search.value = 'marker phrase'; await runSearch(1); await settle();
    out.searchHits = hits.length; out.searchPage = P.hit && P.hit.page; out.highlightBoxes = el.pdfview.querySelectorAll('.hl').length; out.shownAtHit = shown();
    clearHits(); el.search.value = '';

    // gestures
    const W = el.stage.clientWidth, y = el.stage.clientHeight / 2, T = el.pdfview;
    go(1, false); await settle();
    await drag([[W * 0.9, y]], T); await settle(); out.tapRightTurns = shown()[0] === 3;
    await drag([[W * 0.8, y], [W * 0.6, y], [W * 0.4, y], [W * 0.2, y]], T); await settle(); out.swipeLeftTurns = shown()[0] === 4;
    await drag([[W * 0.2, y], [W * 0.4, y], [W * 0.6, y], [W * 0.8, y]], T); await settle(); out.swipeRightTurns = shown()[0] === 3;
    const r0 = el.pdfview.getBoundingClientRect(), cx = r0.left + r0.width / 2, cy = r0.top + r0.height / 2;
    await pinch(cx, cy, 40, 120, T); await settle();
    const r1 = el.pdfview.getBoundingClientRect();
    out.pinchZoom = +P.zoom.toFixed(2); out.pinchKeptPage = shown()[0] === 3; out.pinchTransformCleared = el.pdfview.style.transform === '';
    out.pinchCentreOffset = [Math.round(r1.left + r1.width / 2 - cx), Math.round(r1.top + r1.height / 2 - cy)];
    const c = el.pdfview.querySelector('canvas'); out.canvasPx = c.width * c.height; out.cssPx = [c.offsetWidth, c.offsetHeight];
    const s0 = [el.pdfwrap.scrollLeft, el.pdfwrap.scrollTop];
    fire('pointerdown', 1, cx, cy, T);
    for (let i = 1; i <= 4; i++) { await sleep(40); fire('pointermove', 1, cx - 25 * i, cy - 25 * i, T); }
    await sleep(150);   // finger rests before lifting: no fling
    fire('pointerup', 1, cx - 100, cy - 100, T);
    out.panMoves = [Math.round(el.pdfwrap.scrollLeft - s0[0]), Math.round(el.pdfwrap.scrollTop - s0[1])];
    out.panKeptPage = shown()[0] === 3;
    await pinch(cx, cy, 150, 30, T); await settle();
    out.pinchBackZoom = +P.zoom.toFixed(2); out.pinchBackScroll = [el.pdfwrap.scrollLeft, el.pdfwrap.scrollTop];
    el.bigger.onclick(); await settle(); out.plusZoom = P.zoom;
    el.smaller.onclick(); await settle(); out.minusZoom = P.zoom;

    // themes: Night darkens the paper and lightens plain text by redrawing, with no filter laid over the page
    const corner = () => { const c = el.pdfview.querySelector('canvas'); return [...c.getContext('2d').getImageData(2, 2, 1, 1).data.slice(0, 3)]; };
    const darkest = () => { const c = el.pdfview.querySelector('canvas'), d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data; let m = 765; for (let i = 0; i < d.length; i += 4 * 7) m = Math.min(m, d[i] + d[i + 1] + d[i + 2]); return m; };
    const themeTo = async t => { while (prefs.theme !== t) el.theme.onclick(); await settle(); };
    await themeTo('paper'); out.paperCorner = corner();
    await themeTo('night'); out.nightCorner = corner(); out.nightDarkestSum = darkest();
    out.nightCssFilter = getComputedStyle(el.pdfview.querySelector('canvas')).filter;
    out.nightKeptPage = shown()[0] === 3;
    await themeTo('sepia'); out.sepiaCorner = corner();
    await themeTo('paper'); out.paperAgainCorner = corner();
    out.done = true;
  } catch (e) { errors.push(String(e && e.stack || e)); }
  report(out, errors);
})();
})();
</script>
</body>
